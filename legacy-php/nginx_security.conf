# =========================
# NGINX SECURITY CONFIGURATION
# Date: February 9, 2026
# Tambahkan konfigurasi ini ke dalam block server {} di nginx config
# =========================

# Block access to sensitive files
location ~ ^/(config\.php|cekphp\.php|composer\.(json|lock|phar)|\.user\.ini|\.ftpquota|\.git|\.svn|\.env)$ {
    deny all;
    return 404;
}

# Block access to backup and source files
location ~* \.(bak|backup|old|orig|save|swp|tmp|sql|db|sqlite|log)$ {
    deny all;
    return 404;
}

# Block access to hidden files
location ~ /\. {
    deny all;
    return 404;
}

# Disable PHP execution in upload directories
location ~* ^/(upload|userfiles|video)/.*\.(php|php3|php4|php5|phtml)$ {
    deny all;
    return 404;
}

# Block suspicious query strings and requests
location / {
    # Block SQL injection attempts
    if ($query_string ~* "(union|select|insert|drop|update|delete|concat|script|javascript|eval|base64|0x)") {
        return 403;
    }
    
    # Block path traversal attempts
    if ($query_string ~* "(\.\./)|(\.\.\\)") {
        return 403;
    }
    
    # Block file inclusion attempts
    if ($query_string ~* "(file=|path=|img=.*\.\.|type=.*\.\.)") {
        return 403;
    }
}

# Block suspicious user agents
if ($http_user_agent ~* (libwww-perl|wget|python|nikto|curl|scan|java|winhttp|clshttp|loader|HTTrack|harvest|extract|grab|miner)) {
    return 403;
}

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Disable server signature
server_tokens off;

# Rate limiting (uncomment and adjust if needed)
# limit_req_zone $binary_remote_addr zone=limitreq:10m rate=10r/s;
# limit_req zone=limitreq burst=20 nodelay;

# Connection limiting
# limit_conn_zone $binary_remote_addr zone=limitconn:10m;
# limit_conn limitconn 10;

